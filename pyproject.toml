[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agent-safety-env"
version = "2.0.0"
description = "OpenEnv RL environment for AI agent safety testing"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "gradio>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24.0"]

[project.scripts]
server = "agent_safety_env.server.app:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["agent_safety_env*"]
